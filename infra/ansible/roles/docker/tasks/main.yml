---
- name: Install Docker and the Python Docker SDK
  ansible.builtin.apt:
    name:
      - docker.io
      - python3-docker
    state: present

- name: Enable and start Docker
  ansible.builtin.service:
    name: docker
    state: started
    enabled: true

- name: Allow the SSH user to run docker without sudo
  ansible.builtin.user:
    name: "{{ ansible_user }}"
    groups: docker
    append: true
